media:
  input: assets/uploads
  output: assets/uploads

content:
  - name: landing-page
    label: Landing Page (Hero & CEO Note)
    path: content/landing.json
    type: file
    fields:
      - name: heroEyebrow
        label: Top Hero Badge Text
        type: string
      - name: heroHeadingLine1
        label: Hero Main Headline (Line 1)
        type: string
      - name: heroHeadingLine2
        label: Hero Gold Italic Headline (Line 2)
        type: string
      - name: heroDescription
        label: Hero Description Paragraph
        type: text

      - name: heroSlides
        label: Home Page Hero Slider Images
        type: object
        list: true
        fields:
          - name: stepLabel
            label: Slide Subtitle (e.g. 01 / Bespoke Atelier)
            type: string
          - name: title
            label: Slide Headline
            type: string
          - name: ctaText
            label: Link Text
            type: string
          - name: targetPage
            label: Destination Page
            type: select
            options:
              values:
                - value: suiting
                  label: Fine Suiting Page
                - value: leather
                  label: Heritage Leather Page
                - value: collections
                  label: All Collections Page
          - name: image
            label: Slide Image (Upload from computer or select from Media)
            type: image

      - name: ceoMessage
        label: Founder & CEO Editorial Card (Bottom of Home Page)
        type: object
        fields:
          - name: portraitImage
            label: CEO Portrait Photo (Upload from computer)
            type: image
          - name: founderName
            label: Founder / CEO Name
            type: string
          - name: roleTitle
            label: Role Title
            type: string
          - name: eyebrow
            label: Card Eyebrow Label
            type: string
          - name: quote
            label: Highlighted Quote
            type: text
          - name: messageBody
            label: Message Paragraph
            type: text
          - name: locationNote
            label: Atelier Badge Text
            type: string

  - name: products-catalog
    label: Products Catalog (Suiting, Leather & Tailored)
    path: content/products.json
    type: file
    fields:
      - name: items
        label: All Products
        type: object
        list: true
        fields:
          - name: id
            label: Product ID (Unique Number)
            type: number
          - name: featured
            label: Show on Home Page Signature Creations?
            type: boolean
          - name: name
            label: Product Name
            type: string
          - name: category
            label: Department
            type: select
            options:
              values:
                - value: suiting
                  label: Fine Suiting
                - value: leather
                  label: Heritage Leather
                - value: tailored
                  label: Tailored Essentials
          - name: pricePKR
            label: Price (PKR)
            type: number
          - name: unit
            label: Cut / Material Subtitle (e.g. 4.5m Unstitched Cut)
            type: string
          - name: image
            label: Product Photo (Upload from computer)
            type: image
          - name: description
            label: Product Description
            type: text
          - name: colorNames
            label: Color Names
            type: string
            list: true
          - name: colors
            label: Color Hex Swatches (e.g. #2B211B)
            type: string
            list: true
          - name: options
            label: Size / Cut Options
            type: string
            list: true

  - name: site-settings
    label: Store Location, Hours & Contact
    path: content/settings.json
    type: file
    fields:
      - name: announcementText
        label: Top Announcement Bar Text
        type: string
      - name: address
        label: Flagship Boutique Address
        type: string
      - name: mapsUrl
        label: Google Maps Link
        type: string
      - name: phoneDisplay
        label: Phone / WhatsApp Display Number
        type: string
      - name: phoneDial
        label: Phone Dial Format (e.g. +923145656060)
        type: string
      - name: whatsappNumber
        label: WhatsApp Link Digits (e.g. 923145656060)
        type: string
      - name: email
        label: Concierge Email Address
        type: string
      - name: hours
        label: Boutique Opening Hours
        type: string